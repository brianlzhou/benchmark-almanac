name: Sync scores

# Every day, refresh official leaderboards, Epoch AI scores, GitHub repo facts and the paper abstracts of new
# benchmarks. Changes go to one rolling pull request, so new models and benchmarks get a look before they
# appear on the site.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    # an explicit bash shell runs with pipefail, so a script that fails before `| tee` fails its step
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-epoch.ts | tee sync.log
      - run: node scripts/sync-leaderboards.ts | tee -a sync.log
      - run: node scripts/sync-github.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # only benchmarks with no abstract yet: a few arXiv requests, three seconds apart
      - run: node scripts/abstracts.ts | tee -a sync.log
        env:
          # optional: with an OpenReview account, papers that are only on OpenReview get their abstracts too
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
      - run: node scripts/check-data.ts
      - run: npm run build
      - name: Update the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/sync
          git add data
          git commit -m "Sync leaderboards, Epoch AI scores, GitHub repo facts and paper abstracts ($(date -u +%F))"
          git push --force origin bot/sync
          # a pull request body holds at most 65,536 characters, and the full log runs far longer, so the body keeps
          # its last 50,000 bytes and links the run for the rest
          {
            echo "The daily sync refreshed leaderboard scores, Epoch AI scores, GitHub repo facts and paper abstracts. The data checks and the build passed. Merge it to publish the new scores."
            echo
            echo "Full log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -c 50000 sync.log
            echo '```'
          } > pr-body.md
          if gh pr view bot/sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit bot/sync --body-file pr-body.md
          else
            gh pr create --head bot/sync --title "Score sync" --body-file pr-body.md
          fi
          # the data checks and the build above already passed on this commit, so the sync merges itself and the new
          # scores go live without waiting for a maintainer. A conflict with main leaves the pull request open
          # for a person, and the next day's run rebuilds the branch from main.
          gh pr merge bot/sync --merge || echo "::warning::The sync pull request could not merge on its own. A maintainer needs to merge it."
